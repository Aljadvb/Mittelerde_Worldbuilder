name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-apk:
    name: Tests und Android-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android-Plattform 36 installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Tests und APK
        run: ./gradlew test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/build/screenshots/
            editor/build/screenshots/

  editor-windows:
    name: Windows-Editor (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Installationspaket bauen
        shell: bash
        run: ./gradlew :editor:packageMsi -PskipAndroid=true
      - uses: actions/upload-artifact@v4
        with:
          name: editor-windows-msi
          path: editor/build/compose/binaries/main/msi/*.msi
