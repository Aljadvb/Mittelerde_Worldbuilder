name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-apk:
    name: Tests und Android-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android-Plattform 36 installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Tests und APK
        run: ./gradlew test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/build/screenshots/
            editor/build/screenshots/

  editor-windows:
    name: Windows-Editor (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Installationspaket bauen
        shell: bash
        # The installer version comes from version.txt (read by editor/build.gradle.kts).
        run: ./gradlew :editor:packageMsi -PskipAndroid=true
      - uses: actions/upload-artifact@v4
        with:
          name: editor-windows-msi
          path: editor/build/compose/binaries/main/msi/*.msi

  release:
    name: GitHub-Release
    # Publishes a release when version.txt names a version that has no release yet.
    needs: [test-and-apk, editor-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version prüfen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < version.txt)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG existiert bereits – nichts zu tun."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          path: artifacts
      - name: Release erstellen
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir upload
          cp artifacts/editor-windows-msi/*.msi "upload/Mittelerde-Worldbuilder-Editor-${TAG}.msi"
          cp artifacts/android-app-debug/*.apk "upload/Mittelerde-Worldbuilder-App-${TAG}.apk"
          gh release create "$TAG" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mittelerde Worldbuilder ${TAG}" \
            --prerelease \
            --notes "Windows-Editor (.msi, Java enthalten) und Android-App (.apk). Installation: siehe docs/EDITOR.md."
