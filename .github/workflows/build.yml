name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-apk:
    name: Tests und Android-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android-Plattform 36 installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Tests und APK
        run: ./gradlew test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/build/screenshots/
            editor/build/screenshots/

  editor-windows:
    name: Windows-Editor (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Installationspaket bauen
        shell: bash
        # For version tags (v1.2.3) the installer gets that version, so newer releases upgrade older ones.
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          ./gradlew :editor:packageMsi -PskipAndroid=true -PappVersion="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-windows-msi
          path: editor/build/compose/binaries/main/msi/*.msi

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-apk, editor-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir upload
          cp artifacts/editor-windows-msi/*.msi "upload/Mittelerde-Worldbuilder-Editor-${TAG}.msi"
          cp artifacts/android-app-debug/*.apk "upload/Mittelerde-Worldbuilder-App-${TAG}.apk"
          gh release create "$TAG" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mittelerde Worldbuilder ${TAG}" \
            --prerelease \
            --notes "Windows-Editor (.msi, Java enthalten) und Android-App (.apk). Installation: siehe docs/EDITOR.md."
